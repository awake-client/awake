name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    # src/app links the Wails webview, whose GTK/WebKit headers are not on the
    # Ubuntu runners; the Go suite runs on macOS, like continuous integration.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./src/...

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci && npm test -- --watch=false

  build:
    name: ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            tags: production,purego
            binary: awake
            archive: awake-darwin-arm64.zip
          - name: macOS amd64
            os: macos-latest
            goos: darwin
            goarch: amd64
            tags: production,purego
            binary: awake
            archive: awake-darwin-amd64.zip
          - name: Linux amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            tags: production,purego
            binary: awake
            archive: awake-linux-amd64.tar.gz
          - name: Linux arm64
            os: ubuntu-latest
            goos: linux
            goarch: arm64
            tags: production,purego
            binary: awake
            archive: awake-linux-arm64.tar.gz
          - name: Windows amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            tags: production
            binary: awake.exe
            archive: awake-windows-amd64.zip

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          ldflags="-s -w -X github.com/clementherve/awake/src/features/updates.Version=${version}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ldflags="${ldflags} -H windowsgui"
          fi
          mkdir -p dist
          go build \
            -tags "${{ matrix.tags }}" \
            -trimpath -buildvcs=false \
            -ldflags "${ldflags}" \
            -o "dist/${{ matrix.binary }}" .

      - name: Package macOS app bundle
        if: matrix.goos == 'darwin'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          app="dist/Awake.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "dist/${{ matrix.binary }}" "$app/Contents/MacOS/awake"
          cp build/darwin/icons.icns "$app/Contents/Resources/icons.icns"
          if [ -f build/darwin/Assets.car ]; then
            cp build/darwin/Assets.car "$app/Contents/Resources/Assets.car"
          fi
          cp build/darwin/Info.plist "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString ${version}" \
            -c "Set :CFBundleVersion ${version}" \
            "$app/Contents/Info.plist"
          /usr/bin/codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" "dist/${{ matrix.archive }}"

      - name: Package Linux archive
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          # Ship the desktop entry and icon so install.sh can set up the
          # application menu without downloading anything else.
          cp build/appicon.png dist/awake.png
          sed 's|^Exec=.*|Exec=awake %u|' build/linux/desktop > dist/awake.desktop
          tar -czf "dist/${{ matrix.archive }}" -C dist \
            "${{ matrix.binary }}" awake.png awake.desktop
          rm -f dist/awake.png dist/awake.desktop

      - name: Package Windows archive
        if: matrix.goos == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/${{ matrix.binary }}" -DestinationPath "dist/${{ matrix.archive }}"

      - name: Install NSIS
        if: matrix.goos == 'windows'
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Download WebView2 bootstrapper
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $bootstrapper = "build/windows/nsis/MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile $bootstrapper
          $size = (Get-Item $bootstrapper).Length
          if ($size -lt 1MB) {
            throw "WebView2 bootstrapper download looks invalid ($size bytes)"
          }

      - name: Build Windows installer
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:VERSION -replace '^v', ''
          $numeric = if ($version -match '^(\d+\.\d+\.\d+)') { $Matches[1] } else { '0.1.0' }

          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            $makensis = @(
              'C:\Program Files (x86)\NSIS\makensis.exe',
              'C:\Program Files\NSIS\makensis.exe'
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $makensis) { throw 'makensis not found after installing NSIS' }

          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Push-Location build/windows/nsis
          try {
            & $makensis `
              "-DARG_WAILS_AMD64_BINARY=$env:GITHUB_WORKSPACE\dist\${{ matrix.binary }}" `
              "-DINFO_PRODUCTVERSION=$numeric" `
              "-DWAILS_INSTALL_SCOPE=user" `
              "-DREQUEST_EXECUTION_LEVEL=user" `
              project.nsi
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

          Copy-Item -Path "bin/awake-amd64-installer.exe" `
            -Destination "dist/awake-windows-amd64-installer.exe" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

      - name: Upload Windows installer
        if: matrix.goos == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: Windows amd64 installer
          path: dist/awake-windows-amd64-installer.exe
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS

      - name: Create or update the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Awake ${version}" \
              --generate-notes
          fi
