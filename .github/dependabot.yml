version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Angular pins the TypeScript version it supports, so a TypeScript major
    # must wait for the matching Angular major.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'ng-packagr', 'typescript', 'zone.js', 'rxjs']
      frontend-development:
        dependency-type: development
        patterns: ['*']
      frontend-production:
        dependency-type: production
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
