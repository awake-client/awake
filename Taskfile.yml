version: '3'

vars:
  APP_NAME: awake
  BIN_DIR: bin
  PACKAGE_MANAGER: npm
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target operating system for build and package tasks. Defaults to the host
  # and can be overridden with `wails3 task build GOOS=windows`.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application for the target operating system
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages the application for the target operating system
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application with frontend hot reload
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  test:
    summary: Runs the Go and frontend test suites
    cmds:
      - go test ./src/...
      - task: frontend:test

  frontend:test:
    summary: Runs the Angular unit tests
    dir: frontend
    cmds:
      - npm test -- --watch=false

  lint:
    summary: Runs the Go linters
    cmds:
      - golangci-lint run ./...

  format:
    summary: Formats the Go sources
    cmds:
      - gofmt -w .
