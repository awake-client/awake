<header class="titlebar">
  <div class="titlebar-start">
    <app-workspace-switcher />
  </div>

  <button type="button" class="search-trigger" (click)="openCommandPalette()">
    <app-icon name="search" [size]="14" />
    <span>Search requests</span>
    <kbd>⌘P</kbd>
  </button>

  <div class="titlebar-end">
    <app-environment-picker
      [environments]="environments()"
      [selected]="selectedEnvironment()"
      (selectedChange)="chooseEnvironment($event)"
      (editRequested)="editEnvironment($event)"
    />
  </div>
</header>

<div
  class="workspace-body"
  [style.grid-template-columns]="layout.sidebarWidth() + 'px minmax(0, 1fr)'"
>
  <aside class="sidebar">
    <app-resize-handle
      orientation="vertical"
      title="Drag to resize, double click to reset"
      (resize)="layout.setSidebarWidth($event.x)"
      (reset)="layout.setSidebarWidth(defaultSidebarWidth)"
    />
    <app-collection-tree
      class="sidebar-tree"
      [workspaceRoot]="rootPath()"
      (requestSelected)="openRequest($event)"
    />

    <nav class="sidebar-sections" aria-label="Workspace tools">
      @for (section of sections; track section.route) {
        <a class="sidebar-section" [routerLink]="section.route" routerLinkActive="active">
          <app-icon [name]="section.icon" [size]="15" />
          <span>{{ section.label }}</span>
        </a>
      }
    </nav>

    <footer class="sidebar-footer">
      @if (modeLabel(); as mode) {
        <span class="mode-badge">{{ mode }}</span>
      }
      @if (gitSync.state() !== 'off') {
        <a
          class="sync-chip"
          routerLink="/workspace/git"
          [attr.data-state]="gitSync.state()"
          [title]="gitSync.message() || gitSync.label()"
        >
          <app-icon name="refresh" [size]="12" [class.spinning]="gitSync.state() === 'syncing'" />
          {{ gitSync.label() }}
        </a>
      } @else {
        <span class="sidebar-version">v{{ version() || '0.1.0' }}</span>
      }
      <span class="footer-spacer"></span>
      @if (updateError(); as message) {
        <span class="update-error" [title]="message">Update unavailable</span>
      }
      <app-theme-picker />
      <button
        type="button"
        class="icon-btn"
        [title]="'Check for updates' + (version() ? ' (v' + version() + ')' : '')"
        aria-label="Check for updates"
        (click)="checkForUpdates()"
      >
        <app-icon name="arrow-up-circle" [size]="14" />
      </button>
    </footer>
  </aside>

  <main class="sheet" [attr.data-color]="environmentColor() || null">
    @if (tabs.tabs().length > 0) {
      <app-request-tabs />
    }
    <div class="sheet-content">
      <router-outlet />
    </div>
  </main>
</div>

<app-command-palette />
<app-new-entry-dialog />
<app-confirmation-dialog />
<app-prompt-dialog />
<app-environment-dialog />
