<header class="workspace-header">
  <div class="workspace-identity">
    <span class="workspace-name">
      {{ workspace()?.configuration?.Name }}
    </span>
    @if (modeLabel(); as mode) {
      <span class="mode-badge">{{ mode }}</span>
    }
  </div>

  <div class="workspace-actions">
    <a class="ghost-button" routerLink="/workspace/history">History</a>

    <label class="environment-picker">
      <span class="environment-label">Environment</span>
      <select
        [value]="selectedEnvironment()"
        (change)="selectEnvironment($event)"
      >
        <option value="">No environment</option>
        @for (environment of environments(); track environment.FileName) {
          <option [value]="environment.FileName">
            {{ environment.Name }}{{ environment.HasLocalOverrides ? ' (local)' : '' }}
          </option>
        }
      </select>
    </label>

    <button type="button" class="ghost-button" (click)="switchWorkspace()">
      Switch workspace
    </button>
  </div>
</header>

<div class="workspace-body">
  <aside class="tree-panel">
    <app-collection-tree
      [workspaceRoot]="rootPath()"
      (requestSelected)="openRequest($event)"
    />
  </aside>

  <section class="editor-panel">
    <router-outlet />
  </section>
</div>
