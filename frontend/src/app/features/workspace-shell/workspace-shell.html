<header class="workspace-header">
  <div class="workspace-identity">
    <span class="home-icon" aria-hidden="true">⌂</span>
    <span class="workspace-name">
      {{ workspace()?.configuration?.Name }}
    </span>
    @if (modeLabel(); as mode) {
      <span class="mode-badge">{{ mode }}</span>
    }
  </div>

  <div class="workspace-brand">
    <span class="brand-mark">A</span>
    <span>Awake</span>
  </div>

  <div class="workspace-actions">
    <button
      type="button"
      class="ghost-button"
      title="Search requests (Ctrl/Cmd + P)"
      (click)="openCommandPalette()"
    >
      Search
    </button>
    <a class="ghost-button" routerLink="/workspace/history">History</a>
    <a class="ghost-button" routerLink="/workspace/environments">Environments</a>
    <a class="ghost-button" routerLink="/workspace/git">Git</a>
    <a class="ghost-button" routerLink="/workspace/interop">Import</a>

    <label class="environment-picker">
      <select
        [value]="selectedEnvironment()"
        (change)="selectEnvironment($event)"
        title="Environment"
      >
        <option value="">No environment</option>
        @for (environment of environments(); track environment.FileName) {
          <option [value]="environment.FileName">
            {{ environment.Name }}{{ environment.HasLocalOverrides ? ' (local)' : '' }}
          </option>
        }
      </select>
    </label>

    <button
      type="button"
      class="ghost-button"
      [title]="'Check for updates' + (version() ? ' (v' + version() + ')' : '')"
      (click)="checkForUpdates()"
    >
      Updates
    </button>
    @if (updateError(); as message) {
      <span class="update-error" [title]="message">Update unavailable</span>
    }

    <button type="button" class="ghost-button" (click)="switchWorkspace()">
      Switch workspace
    </button>
  </div>
</header>

<div class="workspace-body">
  <aside class="tree-panel">
    <app-collection-tree
      [workspaceRoot]="rootPath()"
      (requestSelected)="openRequest($event)"
    />
  </aside>

  <section class="editor-panel">
    <router-outlet />
  </section>
</div>

<footer class="status-bar">
  <span class="status-item">
    <span class="status-dot"></span>
    {{ selectedEnvironmentLabel() }}
  </span>
  @if (modeLabel(); as mode) {
    <span class="status-item">{{ mode }} workspace</span>
  }
  <span class="status-spacer"></span>
  <button type="button" class="status-button" (click)="openCommandPalette()">
    Search ⌘P
  </button>
  <span class="status-item">v{{ version() || '0.1.0' }}</span>
</footer>

<app-command-palette />
